<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>⚠️ Предупреждение</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #121212; /* dark background */
      color: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .box {
      background-color: #1d1d1d; /* dark paper */
      border: 2px solid #ff9800; /* warning border */
      color: #f5f5f5;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      max-width: 520px;
      box-shadow: 0 0 12px rgba(255, 152, 0, 0.4);
    }

    h1 {
      color: #ff9800; /* warning color */
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 10px;
      font-size: 16px;
      color: #cccccc;
    }

    button.btn {
      margin-top: 24px;
      padding: 12px 24px;
      background: #f44336; /* error color */
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button.btn:hover {
      background: #c62828; /* darker error */
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      .box {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>⚠️ Внимание!</h1>
    <p>Вы собираетесь перейти по подозрительной ссылке.</p>
    <p>Продолжайте только если уверены в её безопасности.</p>
    <button id="proceed-btn" class="btn">Перейти всё равно</button>
  </div>

  <script src="warning.js"></script>
</body>
</html>
