<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вы выиграли iPhone 15 Pro!</title>
  <style>
    body {
      background-color: #fffcf5;
      font-family: 'Arial', sans-serif;
      color: #111;
      text-align: center;
      padding: 40px;
    }

    .fake-header {
      background-color: red;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 10px;
      text-transform: uppercase;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .content {
      background: #fff3cd;
      border: 2px dashed #ff9800;
      padding: 20px;
      margin: 30px auto;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }

    .content h1 {
      color: #c62828;
      font-size: 24px;
    }

    .content p {
      font-size: 18px;
      margin: 10px 0;
    }

    .content strong {
      color: red;
      font-weight: bold;
    }

    .timer {
      font-size: 22px;
      color: #b71c1c;
      margin: 20px 0;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: linear-gradient(to right, #ff0000, #cc0000);
      color: white;
      font-size: 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
    }

    .fake-footer {
      margin-top: 50px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="fake-header">ПОЗДРАВЛЯЕМ!</div>

  <div class="content">
    <h1>Вы стали победителем розыгрыша!</h1>
    <p>Вы были случайно выбраны для получения <strong>iPhone 15 Pro</strong>!</p>
    <p>Подтвердите свои данные, пока не истекло время:</p>
    <div class="timer" id="countdown">Осталось времени: 02:00</div>
    <a href="http://crownsystem.xyz" class="button">Забрать подарок</a>
  </div>

  <div class="fake-footer">
    © 2025 • Все права защищены • Не является мошенничеством (на самом деле — да)
  </div>

  <script>
    let duration = 2 * 60; // 2 минуты в секундах
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
      const minutes = Math.floor(duration / 60).toString().padStart(2, '0');
      const seconds = (duration % 60).toString().padStart(2, '0');
      countdownEl.textContent = `Осталось времени: ${minutes}:${seconds}`;
      duration--;

      if (duration < 0) {
        clearInterval(timer);
        countdownEl.textContent = "Время вышло!";
        document.querySelector('.button').style.pointerEvents = 'none';
        document.querySelector('.button').style.opacity = '0.5';
      }
    }, 1000);
  </script>
</body>
</html>
